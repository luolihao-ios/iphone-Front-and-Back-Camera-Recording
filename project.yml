name: DualCapture
options:
  bundleIdPrefix: com.luolihao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0.9
    CURRENT_PROJECT_VERSION: 10
    PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.dualcapture
    DEVELOPMENT_TEAM: 5J4K4PZHCV
    CODE_SIGN_STYLE: Automatic
targets:
  DualCapture:
    type: application
    platform: iOS
    sources:
      - path: DualCapture
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: 同框之外
        INFOPLIST_KEY_NSCameraUsageDescription: 用于同时录制前后摄像头视频。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于为录制的视频采集音频。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于将录制的视频保存到照片图库。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - DualCaptureTests
  DualCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DualCaptureTests
    dependencies:
      - target: DualCapture
