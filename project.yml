name: DualCapture
options:
  bundleIdPrefix: com.luolihao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0.13
    CURRENT_PROJECT_VERSION: 6
    PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.dualcapture
    DEVELOPMENT_TEAM: 5J4K4PZHCV
    CODE_SIGN_STYLE: Automatic
targets:
  DualCapture:
    type: application
    platform: iOS
    sources:
      - path: DualCapture
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/App-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - DualCaptureTests
  DualCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DualCaptureTests
    dependencies:
      - target: DualCapture
